<div class="card flex justify-content-center">
    <p-drawer [(visible)]="visible">
        <ng-template pTemplate="header">
            <span class="font-bold text-xl">Menú de Navegación</span>
        </ng-template>
        
        <div class="py-3">
            <ul class="list-none p-0 m-0">
                <li class="mb-2">
                    <a routerLink="auth/login" (click)="visible = false" 
                       class="flex align-items-center cursor-pointer p-3 border-round text-700 hover:surface-100 transition-duration-150">
                        <i class="pi pi-user mr-2"></i>
                        <span class="font-medium">Login</span>
                    </a>
                </li>
                <li>
                    <a routerLink="/landing" (click)="visible = false" 
                       class="flex align-items-center cursor-pointer p-3 border-round text-700 hover:surface-100 transition-duration-150">
                        <i class="pi pi-flag mr-2"></i>
                        <span class="font-medium">Landing</span>
                    </a>
                </li>
            </ul>
        </div>
    </p-drawer>

<p-button 
    (onClick)="visible = true" 
    icon="pi pi-bars" 
    label="Abrir Menú"
    styleClass="btn-sidebar-corner">
</p-button>
</div>
