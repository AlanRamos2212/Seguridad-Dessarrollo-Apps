<div class="flex align-items-center justify-content-center min-h-screen bg-blue-50">
  <div class="card p-5 shadow-8 border-round-2xl bg-white" style="width: 100%; max-width: 450px;">
    
    <div class="text-center mb-5">
      <i class="pi pi-user-plus text-blue-600 text-6xl mb-3"></i>
      <h2 class="text-blue-900 text-3xl font-bold mb-2">Crear Cuenta</h2>
      <span class="text-blue-700 font-medium">Únete a nuestra plataforma hoy</span>
    </div>

    <div class="p-fluid">
      <div class="field mb-4">
        <label class="block text-blue-900 font-semibold mb-2">Nombre Completo</label>
        <span class="p-input-icon-left">
          <i class="pi pi-user text-blue-500"></i>
          <input pInputText type="text" placeholder="Tu nombre" class="w-full">
        </span>
      </div>

      <div class="field mb-4">
        <label class="block text-blue-900 font-semibold mb-2">Correo Electrónico</label>
        <span class="p-input-icon-left">
          <i class="pi pi-envelope text-blue-500"></i>
          <input pInputText type="email" placeholder="ejemplo@correo.com" class="w-full">
        </span>
      </div>

      <div class="field mb-4">
        <label class="block text-blue-900 font-semibold mb-2">Contraseña</label>
        <span class="p-input-icon-left">
          <i class="pi pi-lock text-blue-500"></i>
          <input pInputText type="password" placeholder="Mínimo 8 caracteres" class="w-full">
        </span>
      </div>

      <div class="field mb-5">
        <label class="block text-blue-900 font-semibold mb-2">Confirmar Contraseña</label>
        <span class="p-input-icon-left">
          <i class="pi pi-shield text-blue-500"></i>
          <input pInputText type="password" placeholder="Repite tu contraseña" class="w-full">
        </span>
      </div>

      <button pButton pRipple label="Registrarse" 
              class="w-full py-3 text-xl font-bold bg-blue-600 border-none hover:bg-blue-700">
      </button>
    </div>

    <div class="mt-4 text-center">
      <span class="text-600">¿Ya tienes cuenta? </span>
      <a routerLink="/auth/login" class="text-blue-600 font-bold no-underline cursor-pointer hover:underline">
        Inicia sesión aquí
      </a>
    </div>
  </div>
</div>
