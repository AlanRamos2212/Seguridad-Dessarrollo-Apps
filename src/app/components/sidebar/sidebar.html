<p-drawer [(visible)]="visible" [blockScroll]="true" appendTo="body" styleClass="w-20rem">
    <ng-template pTemplate="header">
        <div class="flex align-items-center gap-2">
            <img src="assets/lg1.png" alt="Logo" style="width: 35px" />
            <span class="font-bold text-xl text-primary">ERP SYSTEM</span>
        </div>
    </ng-template>

    <div class="flex flex-column h-full">
        <div class="flex-grow-1 py-3">
            <ul class="list-none p-2 m-0">
                <li *ngFor="let link of sidebarLinks" class="mb-1">
                    <a [routerLink]="link.path"
                       routerLinkActive="bg-primary-reverse text-primary shadow-1"
                       [routerLinkActiveOptions]="{ exact: true }"
                       class="flex align-items-center cursor-pointer p-3 border-round text-700 hover:surface-100 transition-duration-150 transition-colors no-underline">
                        <i [className]="link.icon + ' mr-3 text-xl'"></i>
                        <span class="font-medium">{{ link.name }}</span>
                    </a>
                </li>
            </ul>
        </div>

        <div class="mt-auto border-top-1 surface-border p-4 text-center">
            <span class="text-xs text-400">Version 5.0.0</span>
        </div>
    </div>
</p-drawer>

<div class="p-3">
    <p-button (onClick)="visible = true" 
              icon="pi pi-bars" 
              label="Menú" 
              severity="primary" 
              styleClass="shadow-2">
    </p-button>
</div>
