<p-drawer [(visible)]="visible" [blockScroll]="true" appendTo="body" styleClass="w-20rem custom-sidebar">
    <ng-template pTemplate="header">
        <div class="flex align-items-center gap-3 pl-2">
            <div class="header-icon-wrapper">
                <img src="lg1.png" alt="Logo" style="width: 80px" />
            </div>
            <span class="text-xl erp-title">ERP SYSTEM</span>
        </div>
    </ng-template>

    <div class="flex flex-column h-full">
        <div class="flex-grow-1 pt-3">
            <div class="px-2 mb-3">
                <span class="text-xs uppercase font-bold text-500 px-3 letter-spacing-1">Navegación</span>
            </div>
            <nav>
                <a *ngFor="let link of sidebarLinks()" [routerLink]="link.path" routerLinkActive="active-link"
                    [routerLinkActiveOptions]="{ exact: true }" class="nav-link">
                    <div class="nav-indicator"></div>
                    <i [className]="link.icon + ' nav-icon'"></i>
                    <span>{{ link.name }}</span>
                </a>
            </nav>
        </div>

        <!-- Logout -->
        <div class="px-2 pb-2">
            <button pButton icon="pi pi-sign-out" label="Cerrar Sesión"
                class="w-full p-button-outlined p-button-danger border-round-xl"
                style="background: rgba(239,68,68,0.08); border-color: rgba(239,68,68,0.4); color: #f87171;"
                (click)="logout()">
            </button>
        </div>

        <div class="sidebar-footer">
            <div class="flex align-items-center gap-3">
                <div class="p-2 bg-primary-reverse border-round">
                    <i class="pi pi-shield text-primary"></i>
                </div>
                <div class="flex flex-column text-left">
                    <span class="text-xs font-bold text-0">Security Version</span>
                    <span class="text-xs text-400">v5.2.0-secure</span>
                </div>
            </div>
        </div>
    </div>
</p-drawer>

<div class="p-3">
    <p-button (onClick)="visible = true" icon="pi pi-bars" label="Menú" severity="primary">
    </p-button>
</div>
